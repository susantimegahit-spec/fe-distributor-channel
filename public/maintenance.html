<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081b31" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SMESTA | System Maintenance</title>
    <link rel="icon" type="image/png" href="/smesta-favicon.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        --background: #ffffff;
        --surface: #ffffff;
        --surface-border: #dce8f2;
        --primary: #168bd1;
        --primary-soft: #eaf7ff;
        --success: #17a976;
        --text: #102c48;
        --muted: #607b92;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 14%, rgba(35, 148, 219, 0.09), transparent 34%),
          radial-gradient(circle at 88% 88%, rgba(36, 196, 156, 0.07), transparent 32%),
          var(--background);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.55;
        background-image:
          linear-gradient(rgba(36, 124, 181, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(36, 124, 181, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      main {
        position: relative;
        width: min(720px, calc(100% - 32px));
        max-height: calc(100dvh - 32px);
        margin: 16px auto;
        padding: clamp(32px, 6vw, 64px);
        overflow: hidden;
        text-align: center;
        border: 1px solid var(--surface-border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 24px 70px rgba(26, 73, 108, 0.14);
        backdrop-filter: blur(16px);
      }

      main::after {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 260px;
        height: 260px;
        content: "";
        border-radius: 50%;
        background: rgba(56, 166, 232, 0.06);
        filter: blur(2px);
      }

      .brand {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-bottom: 40px;
      }

      .brand img {
        display: block;
        width: min(190px, 52vw);
        height: auto;
        object-fit: contain;
      }

      .maintenance-icon {
        position: relative;
        z-index: 1;
        display: grid;
        width: 92px;
        height: 92px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid rgba(85, 184, 243, 0.35);
        border-radius: 28px;
        color: var(--primary);
        background: var(--primary-soft);
        box-shadow: 0 18px 42px rgba(20, 139, 212, 0.18);
      }

      .maintenance-icon svg {
        width: 46px;
        height: 46px;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .description {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(15px, 2.4vw, 18px);
        line-height: 1.7;
      }

      .status {
        position: relative;
        z-index: 1;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-top: 28px;
        padding: 10px 16px;
        color: #087451;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid rgba(53, 214, 160, 0.28);
        border-radius: 999px;
        background: #ecfbf5;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 5px rgba(53, 214, 160, 0.1);
        animation: pulse 2s ease-in-out infinite;
      }

      .actions {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        margin-top: 34px;
      }

      button {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        cursor: pointer;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        border: 1px solid #70c9ff;
        border-radius: 12px;
        background: linear-gradient(135deg, #6bc6ff, #3ca9ed);
        box-shadow: 0 12px 28px rgba(31, 151, 224, 0.24);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(31, 151, 224, 0.34);
      }

      button:focus-visible {
        outline: 3px solid rgba(123, 207, 255, 0.35);
        outline-offset: 4px;
      }

      button svg {
        width: 20px;
        height: 20px;
      }

      footer {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        color: #7890a4;
        font-size: 13px;
      }

      @keyframes pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.82);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 480px) {
        main {
          padding: 32px 22px;
          border-radius: 18px;
        }

        .brand {
          margin-bottom: 30px;
        }

        .maintenance-icon {
          width: 78px;
          height: 78px;
          border-radius: 22px;
        }
      }

      @media (max-height: 720px) {
        main {
          padding-top: 24px;
          padding-bottom: 24px;
        }

        .brand {
          margin-bottom: 18px;
        }

        .brand img {
          width: 130px;
        }

        .maintenance-icon {
          width: 68px;
          height: 68px;
          margin-bottom: 18px;
          border-radius: 20px;
        }

        .maintenance-icon svg {
          width: 34px;
          height: 34px;
        }

        .description {
          margin-top: 12px;
          line-height: 1.5;
        }

        .status {
          margin-top: 18px;
        }

        .actions {
          margin-top: 20px;
        }

        footer {
          margin-top: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/smesta-pwa-512.png" alt="SMESTA" />
      </div>

      <div class="maintenance-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a4 4 0 0 0-5-5L12 3.6 9.6 6 7.3 3.7a4 4 0 0 0 5 5l-7.7 7.7a2.1 2.1 0 0 0 3 3l7.7-7.7a4 4 0 0 0 5-5L18 9l-2.4-2.4 2.3-2.3a4 4 0 0 0-3.2 2Z" />
        </svg>
      </div>

      <h1>System Maintenance in Progress</h1>
      <p class="description">
        We are currently improving our services to provide you with a better experience. Please try again in a few moments.
      </p>

      <div class="status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        Maintenance is currently in progress
      </div>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8.1 8.1 0 1 0 2 5.3" />
            <path d="M20 4v7h-7" />
          </svg>
          Try Again
        </button>
      </div>

      <footer>&copy; <span id="year"></span> PT Susanti Megah. All rights reserved.</footer>
    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
