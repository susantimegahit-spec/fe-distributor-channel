<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081b31" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SMESTA | Pemeliharaan Sistem</title>
    <link rel="icon" type="image/png" href="/smesta-favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Montserrat, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        --background: #07182c;
        --surface: rgba(16, 48, 78, 0.88);
        --surface-border: rgba(100, 183, 240, 0.26);
        --primary: #55b8f3;
        --primary-soft: rgba(85, 184, 243, 0.14);
        --success: #35d6a0;
        --text: #eef7ff;
        --muted: #a8bfd3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow-x: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 12% 14%, rgba(35, 148, 219, 0.22), transparent 34%),
          radial-gradient(circle at 88% 88%, rgba(36, 196, 156, 0.13), transparent 32%),
          linear-gradient(145deg, #061528 0%, var(--background) 48%, #0a2742 100%);
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.22;
        background-image:
          linear-gradient(rgba(116, 194, 241, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 194, 241, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      main {
        position: relative;
        width: min(720px, calc(100% - 32px));
        margin: 32px auto;
        padding: clamp(32px, 6vw, 64px);
        overflow: hidden;
        text-align: center;
        border: 1px solid var(--surface-border);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(13, 40, 67, 0.96), var(--surface));
        box-shadow: 0 28px 80px rgba(0, 8, 22, 0.48), inset 0 1px rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px);
      }

      main::after {
        position: absolute;
        top: -100px;
        right: -100px;
        width: 260px;
        height: 260px;
        content: "";
        border-radius: 50%;
        background: rgba(56, 166, 232, 0.08);
        filter: blur(2px);
      }

      .brand {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-bottom: 40px;
      }

      .brand-name {
        color: #f2f8ff;
        font-size: clamp(28px, 6vw, 42px);
        font-weight: 700;
        letter-spacing: 0.22em;
        line-height: 1;
        text-shadow: 0 0 28px rgba(85, 184, 243, 0.2);
      }

      .brand-name span {
        color: var(--primary);
      }

      .maintenance-icon {
        position: relative;
        z-index: 1;
        display: grid;
        width: 92px;
        height: 92px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid rgba(85, 184, 243, 0.35);
        border-radius: 28px;
        color: var(--primary);
        background: var(--primary-soft);
        box-shadow: 0 18px 42px rgba(20, 139, 212, 0.18);
      }

      .maintenance-icon svg {
        width: 46px;
        height: 46px;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.15;
        letter-spacing: -0.035em;
      }

      .description {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(15px, 2.4vw, 18px);
        line-height: 1.7;
      }

      .status {
        position: relative;
        z-index: 1;
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-top: 28px;
        padding: 10px 16px;
        color: #bff9e5;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid rgba(53, 214, 160, 0.28);
        border-radius: 999px;
        background: rgba(53, 214, 160, 0.1);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 5px rgba(53, 214, 160, 0.1);
        animation: pulse 2s ease-in-out infinite;
      }

      .actions {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        margin-top: 34px;
      }

      button {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        min-height: 48px;
        padding: 0 24px;
        cursor: pointer;
        color: #06192b;
        font: inherit;
        font-weight: 700;
        border: 1px solid #70c9ff;
        border-radius: 12px;
        background: linear-gradient(135deg, #6bc6ff, #3ca9ed);
        box-shadow: 0 12px 28px rgba(31, 151, 224, 0.24);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 34px rgba(31, 151, 224, 0.34);
      }

      button:focus-visible {
        outline: 3px solid rgba(123, 207, 255, 0.35);
        outline-offset: 4px;
      }

      button svg {
        width: 20px;
        height: 20px;
      }

      footer {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        color: #7693ab;
        font-size: 13px;
      }

      @keyframes pulse {
        50% {
          opacity: 0.55;
          transform: scale(0.82);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 480px) {
        main {
          padding: 32px 22px;
          border-radius: 18px;
        }

        .brand {
          margin-bottom: 30px;
        }

        .maintenance-icon {
          width: 78px;
          height: 78px;
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="brand-name" aria-label="SMESTA">SM<span>E</span>STA</div>
      </div>

      <div class="maintenance-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a4 4 0 0 0-5-5L12 3.6 9.6 6 7.3 3.7a4 4 0 0 0 5 5l-7.7 7.7a2.1 2.1 0 0 0 3 3l7.7-7.7a4 4 0 0 0 5-5L18 9l-2.4-2.4 2.3-2.3a4 4 0 0 0-3.2 2Z" />
        </svg>
      </div>

      <h1>Sistem Sedang Dalam Pemeliharaan</h1>
      <p class="description">
        Kami sedang melakukan peningkatan layanan untuk memberikan pengalaman yang lebih baik. Silakan coba kembali beberapa saat lagi.
      </p>

      <div class="status" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        Proses pemeliharaan sedang berlangsung
      </div>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8.1 8.1 0 1 0 2 5.3" />
            <path d="M20 4v7h-7" />
          </svg>
          Coba Lagi
        </button>
      </div>

      <footer>&copy; <span id="year"></span> PT Susanti Megah. Seluruh hak dilindungi.</footer>
    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
