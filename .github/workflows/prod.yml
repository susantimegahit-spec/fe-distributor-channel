name: Prod deploy

# Controls when the action will run.
on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔨 Build Project
        run: |
          corepack enable
          yarn set version 4.12.0           
          yarn install --no-immutable
          yarn build

      - name: 📂 Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          # 👈 Sudah diubah menjadi SSH_PRIVATE_KEY sesuai nama di GitHub Secrets Anda
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }} 
          SOURCE: 'dist/'
          REMOTE_HOST: 103.89.4.98
          REMOTE_USER: susantimegah
          REMOTE_PORT: '22' # Coba port 22 dulu, jika error silakan ganti ke '65002'
          TARGET: /home/susantimegah/public_html/customerportal.susantimegah.com/
          EXCLUDE: '/build/'
